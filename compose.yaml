services:
  pace-lab:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:8000"
    environment:
      PACE_MAX_UPLOAD_GB: "${PACE_MAX_UPLOAD_GB:-2}"
    volumes:
      - pace_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pace_data:
